# ==============================================================
# CONFIGURACIÓN GENERAL DEL SERVIDOR
# ==============================================================
spring.application.name=ewuarsoft
server.port=8080
server.servlet.context-path=/
server.error.include-message=always

# ==============================================================
# CONEXIÓN A BASE DE DATOS XAMPP MYSQL (ewuarsoft_app_db)
# ==============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/ewuarsoft_app_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================
# CONFIGURACIÓN DE HIBERNATE / SPRING DATA JPA
# ==============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ==============================================================
# MOTOR DE PLANTILLAS THYMELEAF
# ==============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ==============================================================
# CODIFICACIÓN Y MENSAJES
# ==============================================================
spring.messages.encoding=UTF-8
