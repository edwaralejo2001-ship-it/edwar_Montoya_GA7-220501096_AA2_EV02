<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | EwuarSoft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="brand-icon-box mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.75rem;">
                <i class="bi bi-box-seam-fill"></i>
            </div>
            <h2 class="fw-bold text-dark mb-1">EwuarSoft</h2>
            <p class="text-muted small">Sistema Integral de Inventario y Gestión</p>
        </div>

        <div th:replace="~{fragments/layout :: alertas}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold small text-secondary">Nombre de Usuario</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" name="username" class="form-control form-control-custom border-start-0" placeholder="Ej: admin" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold small text-secondary">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" name="password" class="form-control form-control-custom border-start-0" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 justify-content-center py-2 mb-3">
                <i class="bi bi-box-arrow-in-right"></i>
                <span>Ingresar al Sistema</span>
            </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top">
            <p class="text-muted small mb-1">¿No tienes una cuenta aún?</p>
            <a th:href="@{/registro}" class="text-primary text-decoration-none fw-semibold small">
                Crear una cuenta nueva
            </a>
        </div>

        <!-- Credenciales de Demostración -->
        <div class="mt-4 p-3 bg-light rounded-3 border small">
            <div class="d-flex align-items-center gap-1 text-secondary fw-bold mb-1">
                <i class="bi bi-info-circle-fill text-primary"></i> Credenciales de Acceso:
            </div>
            <div class="d-flex justify-content-between text-muted">
                <span><strong>Usuario:</strong> admin</span>
                <span><strong>Clave:</strong> admin123</span>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
