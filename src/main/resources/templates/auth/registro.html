<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario | EwuarSoft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">

    <div class="auth-card" style="max-width: 480px;">
        <div class="text-center mb-4">
            <div class="brand-icon-box mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.5rem;">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Crear Cuenta</h3>
            <p class="text-muted small">Regístrate en la plataforma EwuarSoft</p>
        </div>

        <div th:replace="~{fragments/layout :: alertas}"></div>

        <form th:action="@{/registro}" th:object="${usuario}" method="post">
            <div class="mb-3">
                <label for="nombreCompleto" class="form-label fw-semibold small text-secondary">Nombre Completo *</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-card-heading"></i></span>
                    <input type="text" id="nombreCompleto" th:field="*{nombreCompleto}" class="form-control form-control-custom border-start-0" placeholder="Ej: Juan Camilo Pérez" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="username" class="form-label fw-semibold small text-secondary">Nombre de Usuario (Login) *</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" th:field="*{username}" class="form-control form-control-custom border-start-0" placeholder="Ej: jperez" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-semibold small text-secondary">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" th:field="*{email}" class="form-control form-control-custom border-start-0" placeholder="correo@ejemplo.com">
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold small text-secondary">Contraseña *</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" th:field="*{password}" class="form-control form-control-custom border-start-0" placeholder="Mínimo 6 caracteres" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 justify-content-center py-2 mb-3">
                <i class="bi bi-check-lg"></i>
                <span>Completar Registro</span>
            </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top">
            <p class="text-muted small mb-1">¿Ya tienes una cuenta registrada?</p>
            <a th:href="@{/login}" class="text-primary text-decoration-none fw-semibold small">
                Volver a Iniciar Sesión
            </a>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
