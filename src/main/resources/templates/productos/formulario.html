<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head(${esEdicion} ? 'Editar Producto' : 'Nuevo Producto')}"></head>
<body>

<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('productos', ${usuarioLogueado})}"></div>

    <main class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>

        <div th:replace="~{fragments/layout :: alertas}"></div>

        <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom">
            <div>
                <h2 class="h3 fw-bold mb-1" th:text="${esEdicion} ? 'Editar Producto de Inventario' : 'Registrar Nuevo Producto'">Producto</h2>
                <p class="text-muted mb-0">Configure las especificaciones comerciales y niveles de inventario</p>
            </div>
            <a th:href="@{/productos}" class="btn-outline-custom">
                <i class="bi bi-arrow-left"></i>
                <span>Volver al catálogo</span>
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-lg-9">
                <div class="content-card">
                    <div class="content-card-header bg-white">
                        <h5 class="card-title mb-0 fw-bold">
                            <i class="bi bi-box-seam-fill text-primary me-2"></i>
                            Datos Técnicos y Precios
                        </h5>
                    </div>
                    <div class="content-card-body">
                        <form th:action="${esEdicion} ? @{/productos/actualizar} : @{/productos/guardar}" th:object="${producto}" method="post">
                            <input type="hidden" th:field="*{id}" th:if="${esEdicion}">

                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label for="codigo" class="form-label fw-semibold small text-secondary">Código / SKU *</label>
                                    <input type="text" id="codigo" th:field="*{codigo}" class="form-control form-control-custom text-uppercase" placeholder="Ej: LIC-009" required>
                                </div>

                                <div class="col-md-8">
                                    <label for="nombre" class="form-label fw-semibold small text-secondary">Nombre Comercial del Producto *</label>
                                    <input type="text" id="nombre" th:field="*{nombre}" class="form-control form-control-custom" placeholder="Ej: Tequila 1800 Añejo 750ml" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="categoria" class="form-label fw-semibold small text-secondary">Categoría *</label>
                                    <select id="categoria" th:field="*{categoria.id}" class="form-select form-select-custom" required>
                                        <option value="" disabled selected>-- Seleccione una categoría --</option>
                                        <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}"></option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="unidadMedida" class="form-label fw-semibold small text-secondary">Unidad de Medida / Presentación</label>
                                    <input type="text" id="unidadMedida" th:field="*{unidadMedida}" class="form-control form-control-custom" placeholder="Ej: Botella 750ml, Caja x 24, Unidad">
                                </div>

                                <div class="col-md-6">
                                    <label for="precioCompra" class="form-label fw-semibold small text-secondary">Precio de Compra ($ COP) *</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted">$</span>
                                        <input type="number" step="0.01" min="0" id="precioCompra" th:field="*{precioCompra}" class="form-control form-control-custom" placeholder="0.00" required>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label for="precioVenta" class="form-label fw-semibold small text-secondary">Precio de Venta ($ COP) *</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted">$</span>
                                        <input type="number" step="0.01" min="0" id="precioVenta" th:field="*{precioVenta}" class="form-control form-control-custom" placeholder="0.00" required>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label for="stockActual" class="form-label fw-semibold small text-secondary">Stock Actual (Existencias) *</label>
                                    <input type="number" min="0" id="stockActual" th:field="*{stockActual}" class="form-control form-control-custom" placeholder="0" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="stockMinimo" class="form-label fw-semibold small text-secondary">Stock Mínimo (Umbral de Alerta) *</label>
                                    <input type="number" min="0" id="stockMinimo" th:field="*{stockMinimo}" class="form-control form-control-custom" placeholder="5" required>
                                    <small class="text-muted">Si el stock actual es igual o menor a este valor, el dashboard generará una alerta de reposición.</small>
                                </div>

                                <div class="col-12 mt-4 pt-3 border-top d-flex justify-content-end gap-2">
                                    <a th:href="@{/productos}" class="btn-outline-custom">Cancelar</a>
                                    <button type="submit" class="btn-primary-custom">
                                        <i class="bi bi-save2-fill"></i>
                                        <span th:text="${esEdicion} ? 'Guardar Cambios' : 'Registrar Producto'">Guardar</span>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
